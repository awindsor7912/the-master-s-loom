title: "The Master's Loom"
description: "A web-first tabletop RPG campaign and live-session platform. D&D 2024 first; additional rulesets later."
url: "https://awindsor7912.github.io"
baseurl: "/the-master-s-loom"
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
theme: minima
plugins:
  - jekyll-seo-tag
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: true

defaults:
  - scope:
      path: ""
    values:
      layout: default

navigation:
  - title: Home
    url: /
  - title: Roadmap
    url: /roadmap.html
  - title: User Journey
    url: /user-journey.html
  - title: Architecture
    url: /architecture/system-architecture.html
  - title: Data Schema
    url: /data/data-schema.html
  - title: Prototype
    url: /prototype/README.html
  - title: Tech Decisions
    url: /evaluations/tech-evaluations.html
